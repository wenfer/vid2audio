version: "3.8"

services:
  vid2audio:
    # NVIDIA GPU acceleration. Requires NVIDIA Container Toolkit on the host.
    #
    # Requirements:
    # - NVIDIA Container Toolkit installed on host
    # - The image ffmpeg and host driver expose compatible CUDA/NVDEC support
    # - nvidia-smi works on the host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - VID2AUDIO_HWACCEL=auto
      - VID2AUDIO_HWACCEL_DEVICE=
      - VID2AUDIO_HWACCEL_FALLBACK=true
