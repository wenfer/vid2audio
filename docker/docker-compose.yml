version: "3.8"

services:
  vid2audio:
    image: ghcr.io/wenfer/vid2audio:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vid2audio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /nas/media/videos:/app/input:ro
      - /nas/media/audio-output:/app/output
      - ../data:/app/data
      # FFmpeg and ffprobe are bundled in the default image.
      # Optional: mount Piper TTS binary and voice models for offline TTS.
      # - /usr/local/bin/piper:/app/bin/piper:ro
      # - /path/to/piper-voices:/app/data/piper-voices:ro
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=vid2audio=info,tower_http=info
      - VID2AUDIO_DB=/app/data/vid2audio.db
      - VID2AUDIO_INPUT=/app/input
      - VID2AUDIO_OUTPUT=/app/output
      - VID2AUDIO_STATIC=/app/static
      - VID2AUDIO_BIND=0.0.0.0:8000
      # The app's "auto" mode uses CPU unless an override exposes a device.
      - VID2AUDIO_HWACCEL=auto
      - VID2AUDIO_HWACCEL_DEVICE=
      - VID2AUDIO_HWACCEL_FALLBACK=true
