version: "3.8"

services:
  vid2audio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vid2audio
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /nas/media/videos:/app/input:ro
      - /nas/media/audio-output:/app/output
      - ../config:/app/config
      - ../data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
