version: "3.8"

# Override: bundle FFmpeg inside the container instead of mounting from host.
# Use this if your host does not have ffmpeg installed or you prefer a
# self-contained image (at the cost of ~80-120MB larger image size).
#
# Usage:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.ffmpeg-bundled.yml up --build
#
# This override uses a custom Dockerfile that installs ffmpeg via apt.

services:
  vid2audio:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ffmpeg-bundled
    volumes:
      - /nas/media/videos:/app/input:ro
      - /nas/media/audio-output:/app/output
      - ../data:/app/data
      # No need to mount host ffmpeg binaries when bundled
