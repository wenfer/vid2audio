version: "3.8"

services:
  vid2audio:
    # Rockchip ARM SoCs such as RK3566/RK3568/RK3588.
    #
    # Notes:
    # - Rockchip acceleration depends on kernel MPP/RGA devices and an FFmpeg
    #   build with rkmpp decoders (h264_rkmpp, hevc_rkmpp).
    # - The default Debian FFmpeg does NOT include rkmpp. Device exposure alone
    #   does not add it; rkmpp requires a custom Vid2Audio image with a matching
    #   FFmpeg build and Rockchip runtime libraries.
    # - Vid2Audio extracts audio streams, so hardware video decode often brings
    #   little benefit. This override only exposes devices and lets the app's
    #   auto/fallback policy keep normal CPU extraction working.
    # - Some NAS images expose only a subset of these devices. Comment out
    #   missing devices if Docker refuses to start.
    devices:
      - /dev/dri:/dev/dri
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    environment:
      - VID2AUDIO_HWACCEL=auto
      - VID2AUDIO_HWACCEL_DEVICE=
      - VID2AUDIO_HWACCEL_FALLBACK=true
