app:
  name: Vid2Audio
  version: 0.1.0

server:
  host: 0.0.0.0
  port: 8000

directories:
  input: /app/input
  output: /app/output
  temp: /tmp/vid2audio

scan:
  min_file_size_mb: 1.0
  video_extensions:
    - .mp4
    - .mkv
    - .avi
    - .mov
  ignored_extensions:
    - .part
    - .tmp
    - .download

extraction:
  default_format: mp3
  default_quality: standard
  default_sample_rate: 44100
  max_concurrent_jobs: 2
  ffmpeg_threads: 4
  hardware_acceleration: auto
  hardware_acceleration_device: ""
  hardware_acceleration_fallback: true

tts:
  enabled: true
  engine: edge-tts
  voice: zh-CN-XiaoxiaoNeural
  rate: +0%
  volume_normalize: true
