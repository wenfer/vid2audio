name: Build Windows desktop installer

# 本机是 WSL/Linux，编不出也验不了 Windows 包：Tauri 只在 Windows 上原生支持
# 打包，而 NSIS 交叉编译是官方文档里的「最后手段」。这个 workflow 就是那台
# 缺失的 Windows 机器。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安装包文件名带版本号，打 tag 时对不上会发出个标错版本的包。
      - name: Match Git tag to desktop version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)"
          if [[ -z "${version}" ]]; then
            echo "Unable to read src-tauri/tauri.conf.json version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match desktop version v${version}" >&2
            exit 1
          fi

      # edition 2024（platform.rs 的 `unsafe extern`）要 1.85+，runner 镜像自带的
      # Rust 可能落后，所以显式装 stable 而不是用镜像里那份。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 用 npm 的 CLI 而不是 `cargo install tauri-cli`：前者下预编译二进制，
      # 后者要现编译 tauri-cli，在 Windows runner 上白等五六分钟。
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"

      # 随包分发的 LGPL FFmpeg。binaries/ 不进仓库（约 115 MB），每次构建重新下。
      - name: Download bundled FFmpeg
        run: python src-tauri/scripts/fetch_ffmpeg.py

      # 从 src-tauri 里跑，和 AGENTS.md 给人的命令保持一致——这样 CI 验的就是
      # 用户真正会执行的那条路径，包括 beforeBuildCommand 的工作目录。
      - name: Build installer
        working-directory: src-tauri
        run: tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vid2audio-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
