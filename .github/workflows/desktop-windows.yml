name: Build Windows installer

# ============================================================================
# 唯一的发布流水线：构建 Windows NSIS 安装包（setup.exe）并发布 GitHub Release。
# Docker 镜像构建已停用（见 docker-ghcr.yml），本仓库不再由 CI 发布镜像。
#
# 触发方式：
#   1. 打 v*.*.* tag（如 v0.2.4）→ 自动构建并发布
#   2. Actions 页面手动 dispatch → 填版本号后构建并发布
#
# 发版约束：
#   - 版本号单一来源是 src-tauri/tauri.conf.json 的 "version"
#   - tag 必须严格等于 v{tauri.conf.json 版本}，防止标错版本
#   - dispatch 填的版本也必须与 tauri.conf.json 一致
#   - 安装包命名规则：vid2audio-<版本>-windows-x64-setup.exe
# ============================================================================
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（X.Y.Z），必须与 src-tauri/tauri.conf.json 一致，例如 0.2.4"
        required: true
      prerelease:
        description: "标记为预发布版本"
        type: boolean
        default: false

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NSIS installer and publish release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write          # 发布 release 需要写权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 版本解析与校验 ====================
      # 所有 bash 语法步骤都必须显式 shell: bash——Windows runner 默认是 pwsh，
      # [[ ]] / $GITHUB_OUTPUT 这些写法在 pwsh 下会直接报错。
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          conf_version="$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n1)"
          if [[ -z "${conf_version}" || ! "${conf_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "无法从 src-tauri/tauri.conf.json 读取合法版本号" >&2
            exit 1
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "v${conf_version}" != "${GITHUB_REF_NAME}" ]]; then
              echo "Git tag ${GITHUB_REF_NAME} 与 tauri.conf.json 版本 v${conf_version} 不一致" >&2
              exit 1
            fi
          else
            version="${{ inputs.version }}"
            if [[ -z "${version}" ]]; then
              echo "手动 dispatch 必须填写 version" >&2
              exit 1
            fi
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "非法版本号 ${version}（需要 X.Y.Z 格式）" >&2
              exit 1
            fi
            if [[ "${version}" != "${conf_version}" ]]; then
              echo "输入版本 ${version} 与 tauri.conf.json 版本 ${conf_version} 不一致" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Collect build metadata
        id: meta
        shell: bash
        run: |
          echo "build_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "${GITHUB_OUTPUT}"
          echo "sha_short=${GITHUB_SHA::8}" >> "${GITHUB_OUTPUT}"

      # edition 2024（platform.rs 的 `unsafe extern`）要 1.85+，runner 镜像自带的
      # Rust 可能落后，所以显式装 stable 而不是用镜像里那份。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 依赖产物全部落在 src-tauri/target（backend/bridge 是 path 依赖，一并编译进来）。
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 用 npm 的 CLI 而不是 `cargo install tauri-cli`：前者下预编译二进制，
      # 后者要现编译 tauri-cli，在 Windows runner 上白等五六分钟。
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"

      # 随包分发的 LGPL FFmpeg。binaries/ 不进仓库（约 115 MB），只在缺失时下载。
      # 脚本按自身路径定位 src-tauri/binaries/（与 tauri.conf.json 的 resources
      # 引用一致），working-directory 只影响日志可读性，不影响下载位置。
      - name: Download bundled FFmpeg
        working-directory: src-tauri
        run: python scripts/fetch_ffmpeg.py

      # ==================== 构建 ====================
      # updater 已启用（bundle.updater.active），tauri build 必须用私钥对安装包
      # 签名，否则构建失败。私钥不进仓库，配在仓库 Secrets 的
      # TAURI_SIGNING_PRIVATE_KEY（生成：npx @tauri-apps/cli signer generate）。
      - name: Check updater signing key
        shell: bash
        run: |
          if [[ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]]; then
            echo "未配置 TAURI_SIGNING_PRIVATE_KEY secret，无法签名更新包。" >&2
            echo "生成密钥：npx @tauri-apps/cli signer generate -w ~/.tauri/vid2audio.key" >&2
            echo "然后把该文件内容加入仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY（公钥已写入 tauri.conf.json）" >&2
            exit 1
          fi

      - name: Build installer
        working-directory: src-tauri
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 安装包统一命名：vid2audio-<版本>-windows-x64-setup.exe
      # （Tauri 默认产物是 Vid2Audio_<版本>_x64-setup.exe，这里重命名；
      #   release 资产与 artifact 使用同一个名字）
      - name: Rename installer
        id: rename
        shell: bash
        run: |
          nsis_dir="src-tauri/target/release/bundle/nsis"
          installer="$(find "${nsis_dir}" -maxdepth 1 -name '*-setup.exe' | head -n1)"
          if [[ -z "${installer}" ]]; then
            echo "未找到 NSIS 安装包产物（${nsis_dir}）" >&2
            exit 1
          fi
          asset="vid2audio-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          mv "${installer}" "${nsis_dir}/${asset}"
          # updater 签名文件跟随安装包重命名，保持 basename 一致。
          sig="$(find "${nsis_dir}" -maxdepth 1 -name '*-setup.exe.sig' | head -n1)"
          if [[ -n "${sig}" ]]; then
            mv "${sig}" "${nsis_dir}/${asset}.sig"
          fi

      # 生成 updater 更新清单 latest.json（Tauri v2 格式），随 release 一起上传。
      # 应用端 endpoints 指向 releases/latest/download/latest.json，因此每次发布
      # 都用同一个文件名覆盖即可。
      - name: Generate updater manifest
        id: manifest
        shell: bash
        run: |
          nsis_dir="src-tauri/target/release/bundle/nsis"
          asset="vid2audio-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          sig_file="${nsis_dir}/${asset}.sig"
          if [[ ! -f "${sig_file}" ]]; then
            echo "未找到签名文件 ${sig_file}" >&2
            exit 1
          fi
          python3 src-tauri/scripts/make_updater_manifest.py \
            "${{ steps.version.outputs.version }}" "${sig_file}" > "${nsis_dir}/latest.json"
          echo "latest.json: $(cat "${nsis_dir}/latest.json")"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vid2audio-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/vid2audio-*-windows-x64-setup.exe
            src-tauri/target/release/bundle/nsis/vid2audio-*-windows-x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
          retention-days: 14

      # ==================== 发布 GitHub Release ====================
      # 默认步骤语义：构建链路任一步失败都不会走到这里（没有 always()）。
      # dispatch 发布一个已存在的版本会失败，这是有意的——防止重复发布。
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "Vid2Audio v${{ steps.version.outputs.version }}"
          files: |
            src-tauri/target/release/bundle/nsis/vid2audio-*-windows-x64-setup.exe
            src-tauri/target/release/bundle/nsis/vid2audio-*-windows-x64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
          fail_on_unmatched_files: true
          prerelease: ${{ inputs.prerelease || false }}
          body: |
            ## Vid2Audio v${{ steps.version.outputs.version }}（Windows）

            - **版本号**：v${{ steps.version.outputs.version }}
            - **构建时间**：${{ steps.meta.outputs.build_time }}
            - **提交**：`${{ steps.meta.outputs.sha_short }}`（${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}）
            - **安装包**：`vid2audio-${{ steps.version.outputs.version }}-windows-x64-setup.exe`

            包含：
            - 完整 Tauri + NSIS 打包
            - 随包 FFmpeg（约 115 MB）
            - 故事机 / 车机 播放优化（FAT 排序）
            - 跨平台 GUI（Tauri v2 + Rust backend）

            安装包命名规则：`vid2audio-<版本>-windows-x64-setup.exe`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
