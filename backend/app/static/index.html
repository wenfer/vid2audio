<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vid2Audio</title>
    <link rel="stylesheet" href="/static/styles.css?v=5" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div>
          <div class="brand">Vid2Audio</div>
          <p>音频任务工作台</p>
        </div>
        <div class="header-note">Ant Design 风格工作台</div>
        <button id="settingsBtn">系统配置</button>
      </header>
      <aside class="sidebar">
        <nav class="main-menu">
          <button class="menu-item active" data-view="workspace">文件管理</button>
          <button class="menu-item" data-view="tasks">任务管理</button>
          <button class="menu-item" data-view="settings">系统配置</button>
        </nav>
        <button id="refreshFilesBtn" class="primary">刷新文件</button>
        <h2 class="nav-title">已分析合集</h2>
        <nav id="collections" class="collections"></nav>
      </aside>
      <main class="content">
        <section class="toolbar">
          <div>
            <h1 id="title">等待扫描</h1>
            <p id="meta">未选择文件</p>
          </div>
        </section>

        <section id="settingsPanel" class="panel hidden">
          <div class="grid">
            <label>
              默认源目录
              <input id="defaultSourcePath" placeholder="/app/input" />
            </label>
            <label>
              输出目录
              <input id="outputDir" placeholder="/app/output" />
            </label>
            <label>
              最小文件大小 MB
              <input id="minFileSize" type="number" min="0" step="0.1" />
            </label>
            <label>
              视频后缀白名单
              <input id="videoExtensions" placeholder=".mp4, .mkv" />
            </label>
            <label>
              过滤后缀
              <input id="ignoredExtensions" placeholder=".part, .tmp" />
            </label>
            <label>
              文件系统排序
              <select id="filesystemSorting">
                <option value="ntfs">NTFS/FAT 兼容排序</option>
                <option value="natural">自然数字排序</option>
                <option value="name">按名称排序</option>
              </select>
            </label>
            <label>
              前导零位数
              <select id="paddingDigits">
                <option value="auto">自动</option>
                <option value="2">2 位</option>
                <option value="3">3 位</option>
                <option value="4">4 位</option>
              </select>
            </label>
            <label>
              硬件加速策略
              <select id="hardwareAcceleration">
                <option value="auto">自动选择（推荐）</option>
                <option value="safe">安全模式（CPU）</option>
                <option value="qsv">Intel QSV</option>
                <option value="vaapi">VAAPI</option>
                <option value="cuda">NVIDIA CUDA</option>
                <option value="rkmpp">Rockchip MPP</option>
                <option value="videotoolbox">Apple VideoToolbox</option>
              </select>
            </label>
            <label>
              加速设备
              <input id="hardwareAccelerationDevice" placeholder="/dev/dri/renderD128，可留空" />
            </label>
            <label>
              默认格式
              <select id="defaultFormat">
                <option value="mp3">MP3</option>
                <option value="m4a">AAC/M4A</option>
                <option value="ogg">OGG</option>
                <option value="flac">FLAC</option>
                <option value="wav">WAV</option>
                <option value="opus">OPUS</option>
              </select>
            </label>
            <label>
              质量
              <select id="defaultQuality">
                <option value="economy">经济 64kbps</option>
                <option value="standard">标准 128kbps</option>
                <option value="premium">优质 192kbps</option>
                <option value="lossless">高质量 320kbps</option>
              </select>
            </label>
            <label>
              TTS 通道
              <select id="ttsProvider">
                <option value="edge">Edge 在线 TTS</option>
                <option value="silent">静音占位</option>
                <option value="disabled">禁用片头</option>
              </select>
            </label>
            <label>
              TTS 失败策略
              <select id="ttsFailureMode">
                <option value="silent">失败时静音占位</option>
                <option value="skip">失败时跳过片头</option>
                <option value="fail">失败时终止任务</option>
              </select>
            </label>
            <label>
              TTS 音色
              <input id="ttsVoice" placeholder="zh-CN-XiaoxiaoNeural" />
            </label>
            <label>
              TTS 语速
              <input id="ttsRate" placeholder="+0%" />
            </label>
            <label class="wide-field">
              片头文本模板 / LLM 提示词
              <input id="introTextTemplate" placeholder="{collection_name}" />
            </label>
          </div>
          <button id="saveSettingsBtn" class="primary">保存设置</button>
        </section>

        <section id="browserPanel" class="panel view-workspace">
          <div class="section-heading">
            <h2>文件浏览器</h2>
            <div class="section-tools">
              <span id="browserSummary"></span>
              <button id="browserPreviewBtn" class="ghost-button">试听文件</button>
            </div>
          </div>
          <div class="browser-toolbar">
            <button id="parentDirBtn">上一级</button>
            <input id="browserPath" />
            <button id="openPathBtn">打开</button>
          </div>
          <div id="fileBrowser" class="file-browser"></div>
        </section>

        <section id="taskPanel" class="panel view-workspace">
          <div class="section-heading">
            <h2>提取设置</h2>
            <span id="taskSummary"></span>
          </div>
          <div class="grid compact-grid">
            <label class="wide-field">
              选中的文件夹或视频
              <input id="sourcePath" placeholder="/app/input/萌鸡小队第一季 或 /app/input/demo.mp4" />
            </label>
            <label>
              任务名称
              <input id="jobName" placeholder="自动使用文件夹名" />
            </label>
            <label>
              音轨
              <select id="trackIndex"></select>
            </label>
            <label>
              本任务加速
              <select id="jobHardwareAcceleration">
                <option value="">使用全局策略</option>
                <option value="auto">自动选择</option>
                <option value="safe">安全模式</option>
                <option value="qsv">Intel QSV</option>
                <option value="vaapi">VAAPI</option>
                <option value="cuda">NVIDIA CUDA</option>
                <option value="rkmpp">Rockchip MPP</option>
                <option value="videotoolbox">Apple VideoToolbox</option>
              </select>
            </label>
            <label>
              格式
              <select id="format">
                <option value="mp3">MP3</option>
                <option value="m4a">AAC/M4A</option>
                <option value="ogg">OGG</option>
                <option value="flac">FLAC</option>
                <option value="wav">WAV</option>
                <option value="opus">OPUS</option>
              </select>
            </label>
            <label>
              质量
              <select id="quality">
                <option value="economy">经济 64kbps</option>
                <option value="standard">标准 128kbps</option>
                <option value="premium">优质 192kbps</option>
                <option value="lossless">高质量 320kbps</option>
              </select>
            </label>
            <label>
              采样率
              <select id="sampleRate">
                <option value="22050">22050Hz</option>
                <option value="44100">44100Hz</option>
                <option value="48000">48000Hz</option>
              </select>
            </label>
            <label>
              开头偏移秒
              <input id="trimStart" type="number" min="0" step="0.1" value="0" />
            </label>
            <label>
              结尾偏移秒
              <input id="trimEnd" type="number" min="0" step="0.1" value="0" />
            </label>
          </div>
          <p id="accelerationHint" class="hint"></p>
          <div class="actions">
            <button id="scanBtn">分析选中项</button>
            <button id="previewBtn">试听选中音轨</button>
            <button id="extractBtn" class="primary">创建音频提取任务</button>
          </div>
          <audio id="previewAudio" controls class="preview-audio hidden"></audio>
        </section>

        <section id="jobPanel" class="panel hidden">
          <div class="section-heading">
            <h2>任务管理</h2>
            <div class="section-tools">
              <span id="jobSummary"></span>
            </div>
          </div>
          <nav id="jobs" class="collections task-list"></nav>
        </section>

        <section id="detail" class="detail empty">
          <div class="empty-state">暂无合集</div>
        </section>
      </main>
    </div>
    <div id="toastStack" class="toast-stack"></div>
    <div id="loadingOverlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-card">
        <div class="spinner"></div>
        <div>
          <strong id="loadingTitle">处理中</strong>
          <p id="loadingMessage">请稍候…</p>
        </div>
      </div>
    </div>
    <div id="jobModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="jobModal"></div>
      <div class="modal-dialog modal-xl">
        <div class="modal-header">
          <div>
            <h2 id="jobModalTitle">任务详情</h2>
            <p id="jobModalMeta"></p>
          </div>
          <div class="modal-actions">
            <button id="deleteJobBtn" class="danger-button">删除任务</button>
            <button data-close-modal="jobModal">关闭</button>
          </div>
        </div>
        <div id="jobModalBody" class="modal-body"></div>
      </div>
    </div>
    <div id="confirmModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="confirmModal"></div>
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <h2 id="confirmTitle">确认操作</h2>
            <p id="confirmMessage"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button data-close-modal="confirmModal">取消</button>
          <button id="confirmActionBtn" class="danger-button">确认</button>
        </div>
      </div>
    </div>
    <script src="/static/app.js?v=5"></script>
  </body>
</html>
