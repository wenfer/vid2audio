<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vid2Audio</title>
    <link rel="stylesheet" href="/static/styles.css?v=7" />
  </head>
  <body>
    <div class="app">
      <!-- Top Navigation -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="brand">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <span>Vid2Audio</span>
          </div>
        </div>
        <nav class="topbar-nav">
          <button class="nav-tab active" data-view="workspace">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
            文件管理
          </button>
          <button class="nav-tab" data-view="tasks">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
            任务管理
          </button>
          <button class="nav-tab" data-view="settings">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            系统配置
          </button>
        </nav>
        <div class="topbar-right">
          <button id="systemStatusBtn" class="icon-btn" title="系统状态">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Workspace View -->
        <div id="workspaceView" class="view">
          <div class="workspace-layout">
            <!-- Left: File Browser -->
            <section class="card file-browser-card">
              <div class="card-header">
                <h2>
                  <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
                  文件浏览器
                </h2>
                <span id="browserSummary" class="text-muted text-sm"></span>
              </div>
              <div class="browser-toolbar">
                <button id="parentDirBtn" class="btn btn-ghost btn-sm" title="上一级目录">
                  <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
                </button>
                <div class="path-input-wrap">
                  <input id="browserPath" class="path-input" placeholder="输入路径..." />
                </div>
                <button id="openPathBtn" class="btn btn-secondary btn-sm">打开</button>
                <button id="refreshFilesBtn" class="btn btn-ghost btn-sm" title="刷新">
                  <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
                </button>
              </div>
              <div id="fileBrowser" class="file-browser-list"></div>
            </section>

            <!-- Right: Extract Settings + Collection Detail -->
            <div class="workspace-right">
              <!-- Extract Settings -->
              <section class="card extract-card">
                <div class="card-header">
                  <h2>
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                    提取设置
                  </h2>
                  <span id="taskSummary" class="badge badge-info"></span>
                </div>
                <div class="extract-form">
                  <div class="form-row">
                    <label class="form-field span-2">
                      <span class="field-label">选中的文件夹或视频</span>
                      <input id="sourcePath" placeholder="/app/input/萌鸡小队第一季" />
                    </label>
                  </div>
                  <div class="form-row">
                    <label class="form-field">
                      <span class="field-label">任务名称</span>
                      <input id="jobName" placeholder="自动使用文件夹名" />
                    </label>
                    <label class="form-field">
                      <span class="field-label">音轨</span>
                      <select id="trackIndex"></select>
                    </label>
                  </div>
                  <div class="form-row">
                    <label class="form-field">
                      <span class="field-label">格式</span>
                      <select id="format">
                        <option value="mp3">MP3</option>
                        <option value="m4a">AAC/M4A</option>
                        <option value="ogg">OGG</option>
                        <option value="flac">FLAC</option>
                        <option value="wav">WAV</option>
                        <option value="opus">OPUS</option>
                      </select>
                    </label>
                    <label class="form-field">
                      <span class="field-label">质量</span>
                      <select id="quality">
                        <option value="economy">经济 64kbps</option>
                        <option value="standard">标准 128kbps</option>
                        <option value="premium">优质 192kbps</option>
                        <option value="lossless">高质量 320kbps</option>
                      </select>
                    </label>
                    <label class="form-field">
                      <span class="field-label">采样率</span>
                      <select id="sampleRate">
                        <option value="22050">22050Hz</option>
                        <option value="44100">44100Hz</option>
                        <option value="48000">48000Hz</option>
                      </select>
                    </label>
                    <label class="form-field">
                      <span class="field-label">硬件加速</span>
                      <select id="jobHardwareAcceleration">
                        <option value="">使用全局策略</option>
                        <option value="auto">自动选择</option>
                        <option value="safe">安全模式</option>
                        <option value="qsv">Intel QSV</option>
                        <option value="vaapi">VAAPI</option>
                        <option value="cuda">NVIDIA CUDA</option>
                        <option value="rkmpp">Rockchip MPP</option>
                        <option value="videotoolbox">Apple VideoToolbox</option>
                      </select>
                    </label>
                  </div>
                  <div class="form-row">
                    <label class="form-field">
                      <span class="field-label">开头偏移秒</span>
                      <input id="trimStart" type="number" min="0" step="0.1" value="0" />
                    </label>
                    <label class="form-field">
                      <span class="field-label">结尾偏移秒</span>
                      <input id="trimEnd" type="number" min="0" step="0.1" value="0" />
                    </label>
                  </div>
                  <p id="accelerationHint" class="hint-text"></p>
                </div>
                <div class="card-actions">
                  <button id="scanBtn" class="btn btn-secondary">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>
                    分析选中项
                  </button>
                  <button id="previewBtn" class="btn btn-ghost">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
                    试听
                  </button>
                  <button id="extractBtn" class="btn btn-primary">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    创建提取任务
                  </button>
                </div>
                <audio id="previewAudio" controls class="preview-audio hidden"></audio>
              </section>

              <!-- Collections -->
              <section class="card collections-card">
                <div class="card-header">
                  <h2>
                    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
                    已分析合集
                  </h2>
                  <span class="text-muted text-sm" id="collectionCount"></span>
                </div>
                <div id="collections" class="collections-list"></div>
              </section>

              <!-- Collection Detail -->
              <section id="detail" class="card detail-card empty">
                <div class="empty-state">
                  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M24 8v32M8 24h32"/>
                  </svg>
                  <p>选择文件夹并分析以查看合集详情</p>
                </div>
              </section>
            </div>
          </div>
        </div>

        <!-- Tasks View -->
        <div id="tasksView" class="view hidden">
          <section class="card">
            <div class="card-header">
              <h2>
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
                任务管理
              </h2>
              <span id="jobSummary" class="text-muted text-sm"></span>
            </div>
            <nav id="jobs" class="jobs-list"></nav>
          </section>
        </div>

        <!-- Settings View -->
        <div id="settingsView" class="view hidden">
          <section class="card settings-card">
            <div class="card-header">
              <h2>
                <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                系统配置
              </h2>
            </div>
            <div class="settings-sections">
              <!-- Paths -->
              <fieldset class="settings-group">
                <legend>路径设置</legend>
                <div class="form-row">
                  <label class="form-field">
                    <span class="field-label">默认源目录</span>
                    <input id="defaultSourcePath" placeholder="/app/input" />
                  </label>
                  <label class="form-field">
                    <span class="field-label">输出目录</span>
                    <input id="outputDir" placeholder="/app/output" />
                  </label>
                </div>
              </fieldset>

              <!-- File Filtering -->
              <fieldset class="settings-group">
                <legend>文件过滤</legend>
                <div class="form-row">
                  <label class="form-field">
                    <span class="field-label">最小文件大小 (MB)</span>
                    <input id="minFileSize" type="number" min="0" step="0.1" />
                  </label>
                  <label class="form-field">
                    <span class="field-label">视频后缀白名单</span>
                    <input id="videoExtensions" placeholder=".mp4, .mkv" />
                  </label>
                  <label class="form-field">
                    <span class="field-label">过滤后缀</span>
                    <input id="ignoredExtensions" placeholder=".part, .tmp" />
                  </label>
                </div>
              </fieldset>

              <!-- Output -->
              <fieldset class="settings-group">
                <legend>输出设置</legend>
                <div class="form-row">
                  <label class="form-field">
                    <span class="field-label">文件系统排序</span>
                    <select id="filesystemSorting">
                      <option value="ntfs">NTFS/FAT 兼容排序</option>
                      <option value="natural">自然数字排序</option>
                      <option value="name">按名称排序</option>
                    </select>
                  </label>
                  <label class="form-field">
                    <span class="field-label">前导零位数</span>
                    <select id="paddingDigits">
                      <option value="auto">自动</option>
                      <option value="2">2 位</option>
                      <option value="3">3 位</option>
                      <option value="4">4 位</option>
                    </select>
                  </label>
                  <label class="form-field">
                    <span class="field-label">默认格式</span>
                    <select id="defaultFormat">
                      <option value="mp3">MP3</option>
                      <option value="m4a">AAC/M4A</option>
                      <option value="ogg">OGG</option>
                      <option value="flac">FLAC</option>
                      <option value="wav">WAV</option>
                      <option value="opus">OPUS</option>
                    </select>
                  </label>
                  <label class="form-field">
                    <span class="field-label">质量</span>
                    <select id="defaultQuality">
                      <option value="economy">经济 64kbps</option>
                      <option value="standard">标准 128kbps</option>
                      <option value="premium">优质 192kbps</option>
                      <option value="lossless">高质量 320kbps</option>
                    </select>
                  </label>
                </div>
              </fieldset>

              <!-- Hardware Acceleration - Enhanced -->
              <fieldset class="settings-group hwaccel-group">
                <legend>硬件加速</legend>
                <!-- Detection Status Panel -->
                <div class="hwaccel-status-panel" id="hwaccelStatusPanel">
                  <div class="hwaccel-status-header">
                    <div class="hwaccel-status-indicator" id="hwaccelIndicator">
                      <span class="status-dot"></span>
                      <span class="status-text" id="hwaccelStatusText">检测中…</span>
                    </div>
                    <div class="hwaccel-status-actions">
                      <span class="text-muted text-sm" id="hwaccelFfmpegVersion"></span>
                      <button id="redetectBtn" class="btn btn-ghost btn-sm" title="重新检测">
                        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>
                        重新检测
                      </button>
                    </div>
                  </div>
                  <!-- Backend Cards -->
                  <div class="hwaccel-backends" id="hwaccelBackends"></div>
                  <!-- Recommendation -->
                  <div class="hwaccel-recommendation" id="hwaccelRecommendation"></div>
                </div>
                <!-- Configuration -->
                <div class="hwaccel-config">
                  <div class="form-row">
                    <label class="form-field">
                      <span class="field-label">全局加速策略</span>
                      <select id="hardwareAcceleration">
                        <option value="auto">自动选择（推荐）</option>
                        <option value="safe">安全模式（CPU）</option>
                        <option value="qsv">Intel QSV</option>
                        <option value="vaapi">VAAPI</option>
                        <option value="cuda">NVIDIA CUDA</option>
                        <option value="rkmpp">Rockchip MPP</option>
                        <option value="videotoolbox">Apple VideoToolbox</option>
                      </select>
                    </label>
                    <label class="form-field">
                      <span class="field-label">加速设备路径</span>
                      <input id="hardwareAccelerationDevice" placeholder="自动检测，通常无需填写" />
                    </label>
                    <label class="form-field">
                      <span class="field-label">失败回退</span>
                      <select id="hardwareAccelerationFallback">
                        <option value="true">启用 CPU 回退（推荐）</option>
                        <option value="false">禁用回退（加速失败则任务失败）</option>
                      </select>
                    </label>
                  </div>
                  <p class="hint-text" id="hwaccelConfigHint">自动模式会根据检测结果选择最佳后端，失败时自动回退到 CPU 处理。</p>
                </div>
              </fieldset>

              <!-- TTS -->
              <fieldset class="settings-group">
                <legend>TTS 片头</legend>
                <div class="form-row">
                  <label class="form-field">
                    <span class="field-label">TTS 通道</span>
                    <select id="ttsProvider">
                      <option value="piper">Piper 离线 TTS（推荐）</option>
                      <option value="edge">Edge 在线 TTS</option>
                      <option value="silent">静音占位</option>
                      <option value="disabled">禁用片头</option>
                    </select>
                  </label>
                  <label class="form-field">
                    <span class="field-label">失败策略</span>
                    <select id="ttsFailureMode">
                      <option value="silent">失败时静音占位</option>
                      <option value="skip">失败时跳过片头</option>
                      <option value="fail">失败时终止任务</option>
                    </select>
                  </label>
                  <label class="form-field">
                    <span class="field-label">TTS 音色</span>
                    <input id="ttsVoice" placeholder="zh_CN-huayan-medium" />
                  </label>
                  <label class="form-field">
                    <span class="field-label">TTS 语速</span>
                    <input id="ttsRate" placeholder="+0%" />
                  </label>
                </div>
                <div class="form-row">
                  <label class="form-field span-2">
                    <span class="field-label">片头文本模板 / LLM 提示词</span>
                    <input id="introTextTemplate" placeholder="{collection_name}" />
                  </label>
                </div>
              </fieldset>
            </div>
            <div class="card-actions">
              <button id="saveSettingsBtn" class="btn btn-primary">
                <svg viewBox="0 0 20 20" fill="currentColor"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
                保存设置
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- Toast Stack -->
    <div id="toastStack" class="toast-stack"></div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="overlay hidden" aria-hidden="true">
      <div class="overlay-card">
        <div class="spinner"></div>
        <div>
          <strong id="loadingTitle">处理中</strong>
          <p id="loadingMessage">请稍候…</p>
        </div>
      </div>
    </div>

    <!-- Job Detail Modal -->
    <div id="jobModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="jobModal"></div>
      <div class="modal-dialog modal-xl">
        <div class="modal-header">
          <div>
            <h2 id="jobModalTitle">任务详情</h2>
            <p id="jobModalMeta" class="text-muted"></p>
          </div>
          <div class="modal-actions">
            <button id="deleteJobBtn" class="btn btn-danger btn-sm">删除任务</button>
            <button class="btn btn-ghost btn-sm" data-close-modal="jobModal">关闭</button>
          </div>
        </div>
        <div id="jobModalBody" class="modal-body"></div>
      </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="confirmModal"></div>
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <h2 id="confirmTitle">确认操作</h2>
            <p id="confirmMessage" class="text-muted"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" data-close-modal="confirmModal">取消</button>
          <button id="confirmActionBtn" class="btn btn-danger">确认</button>
        </div>
      </div>
    </div>

    <script src="/static/app.js?v=7"></script>
  </body>
</html>
